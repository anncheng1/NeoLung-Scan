<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NeoLung Scan</title>
<meta name="description" content="Step-by-step Pleura-ABCDE neonatal lung ultrasound acquisition, scoring and export for AI image review.">

<meta name="theme-color" content="#141f25" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
/* Layout: phone-first single column (max 720px). Sticky top bar + horizontal zone rail; each zone is four numbered acquisition cards. Image wells stay sonogram-black in both themes. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --ink:#12202a; --muted:#56666f; --line:#d3dbe0; --line-2:#e5ebee;
  --accent:#1c5d78; --accent-ink:#ffffff; --accent-weak:#e0edf3;
  --good:#2b8754; --warn:#b37709; --crit:#b3261e; --idle:#97a3ab;
  --well:#06090b; --well-ink:#c7d4da;
  --f-ui:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1317; --surface:#141f25; --ink:#e2e9ed; --muted:#93a3ac; --line:#283841; --line-2:#1d2b32;
  --accent:#6db2cf; --accent-ink:#0b1a21; --accent-weak:#17313c;
  --good:#5ac088; --warn:#e1a93c; --crit:#ef7b72; --idle:#66747c;
  --well:#030506; --well-ink:#c7d4da; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1317; --surface:#141f25; --ink:#e2e9ed; --muted:#93a3ac; --line:#283841; --line-2:#1d2b32;
  --accent:#6db2cf; --accent-ink:#0b1a21; --accent-weak:#17313c;
  --good:#5ac088; --warn:#e1a93c; --crit:#ef7b72; --idle:#66747c;
  --well:#030506; --well-ink:#c7d4da; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;min-height:56px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;gap:8px;align-items:baseline;background:none;border:0;color:var(--ink);cursor:pointer;padding:0;font-family:var(--f-ui)}
.brand{white-space:nowrap}
@media (max-width:420px){.brand small{display:none}}
.brand small{font:500 10.5px var(--f-data);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.bar .sp{flex:1}
main{padding-block:18px 96px}
h1{font-size:23px;letter-spacing:-.015em;margin:0;text-wrap:balance;line-height:1.2}
h2{font-size:16px;margin:0;text-wrap:balance}
h3{font-size:12px;margin:0;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--f-data)} .num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.step{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--f-data);background:var(--accent);color:var(--accent-ink);flex:none}
.step.done{background:var(--good)}
.btn{font:600 15px var(--f-ui);border-radius:10px;padding:11px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--crit)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{font:400 16px var(--f-ui);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:46px;width:100%}
textarea{min-height:84px;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.fields .span{grid-column:1/-1}
.unit{display:flex;align-items:center;gap:8px}.unit span{font:500 12px var(--f-data);color:var(--muted);white-space:nowrap}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer;padding:6px 0}
.check input{width:22px;height:22px;min-height:0;flex:none;margin:1px 0 0;accent-color:var(--accent)}
.note{font-size:13px;padding:10px 12px;border-radius:9px;background:var(--accent-weak)}
.note.warn{background:color-mix(in srgb,var(--warn) 15%,transparent)}
.note.crit{background:color-mix(in srgb,var(--crit) 12%,transparent)}
.note.good{background:color-mix(in srgb,var(--good) 14%,transparent)}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 11.5px var(--f-ui);padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-good{color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent)}
.p-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.p-idle{color:var(--muted);background:var(--line-2)}
.p-acc{color:var(--accent);background:var(--accent-weak)}
.logo{border-radius:7px;align-self:center;flex:none}
.brand{align-items:center}
.install{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:start;border:1.5px solid var(--accent);background:var(--accent-weak)}
.install img{width:56px;height:56px;border-radius:13px}
.install ol{margin:6px 0 0;padding-left:20px;font-size:14px}
.install li{margin-bottom:4px}
.install li svg{vertical-align:-3px}
.patterns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:6px}
.patterns button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;min-height:64px;font-family:var(--f-ui);display:flex;flex-direction:column;gap:1px}
.patterns button b{font-size:15px}
.patterns button small{font-size:12px;color:var(--muted)}
.patterns button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-weak);box-shadow:inset 0 0 0 1px var(--accent)}
.hero-cam{min-height:64px;font-size:17px}
details.findings-more{border-top:1px solid var(--line-2);margin-top:12px;padding-top:4px}
details.findings-more>summary{padding:10px 0}
/* home list */
.exam{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;color:var(--ink);font:inherit;width:100%}
.exam:hover{border-color:var(--accent)}
.exam b{font:600 15px var(--f-data)}
.exam .sc{grid-row:1/3;grid-column:2;text-align:right;font:600 22px var(--f-data);align-self:center}
.exam .sc small{display:block;font:500 11px var(--f-ui);color:var(--muted)}
/* zone rail */
.rail{display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.zc{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);padding:5px 9px;min-width:52px;cursor:pointer;font:600 13px var(--f-data)}
.zc i{width:8px;height:8px;border-radius:50%}
.zc[aria-current="step"]{border-color:var(--accent);background:var(--accent-weak);box-shadow:inset 0 0 0 1px var(--accent)}
.zc small{font:500 10px var(--f-data);color:var(--muted)}
/* placement */
.place{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:440px){.place{grid-template-columns:minmax(0,1fr)}.place svg{max-width:220px}}
.place svg{width:100%;height:auto;display:block}
details{border-top:1px solid var(--line-2);padding-top:10px;margin-top:12px}
summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent)}
details ul{margin:8px 0 0;padding-left:18px;font-size:14px}
details li{margin-bottom:4px}
/* media */
.shots{display:flex;flex-direction:column;gap:12px}
.shot{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.shot .vis{background:var(--well);display:grid;place-items:center;max-height:340px;overflow:hidden}
.shot img,.shot video{max-width:100%;max-height:340px;display:block}
.shot .body{padding:10px 12px}
.qc{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:460px){.qc{grid-template-columns:1fr}}
.qc .check{font-size:13px}
/* findings */
.grp{display:flex;align-items:center;gap:8px;margin:14px 0 4px}
.grp:first-child{margin-top:0}
.grp b{font:700 13px var(--f-data);width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--ink);color:var(--surface)}
.frow{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.frow .lab{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:600}
.ex{font:600 12px var(--f-ui);color:var(--accent);background:none;border:0;cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:2px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:500 14px var(--f-ui);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:8px 14px;min-height:42px;cursor:pointer;flex:1 1 auto}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scores{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:560px){.scores{grid-template-columns:repeat(4,1fr)}}
.scores button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:84px;position:relative;font-family:var(--f-ui)}
.scores b{font:600 24px var(--f-data)}
.scores small{font-size:11.5px;color:var(--muted);line-height:1.3}
.scores button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-weak);box-shadow:inset 0 0 0 1px var(--accent)}
.scores .sug{position:absolute;top:8px;right:8px;font:600 9.5px var(--f-data);color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
/* bottom nav */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .wrap{display:flex;gap:10px;padding-block:10px}
.dock .btn{flex:1}
/* crop */
.cropbox{background:var(--well);border-radius:10px;overflow:hidden;touch-action:none;position:relative}
.cropbox canvas{width:100%;height:auto;display:block;touch-action:none;cursor:crosshair}
/* summary table */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 7px;border-bottom:1px solid var(--line-2);text-align:center;white-space:nowrap}
th{font:600 11px var(--f-data);color:var(--muted);background:var(--bg)}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
th:first-child{background:var(--bg)}
td.off{color:var(--idle)}
tr.grp-r td{background:var(--bg);font:700 11px var(--f-data);color:var(--ink);text-align:left}
.sumg{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.sumg figure{margin:0;background:var(--well);border-radius:8px;overflow:hidden;position:relative;aspect-ratio:4/3}
.sumg img,.sumg video{width:100%;height:100%;object-fit:cover;display:block}
.sumg figcaption{position:absolute;left:4px;top:4px;font:600 11px var(--f-data);background:rgba(0,0,0,.65);color:#fff;border-radius:4px;padding:1px 5px}
.big{font:600 34px var(--f-data);font-variant-numeric:tabular-nums;line-height:1}
.big small{font-size:15px;color:var(--muted)}
/* refs */
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.ref{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ref img{width:100%;display:block;background:#000}
.ref figcaption{padding:10px 12px;font-size:13px}
.ref figcaption b{display:block;font-size:14px}
.attr{font-size:12px;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:30;background:rgba(5,10,13,.82);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .in{background:var(--surface);border-radius:var(--r);max-width:760px;width:100%;max-height:100%;overflow:auto}
.modal img{width:100%;display:block;background:#000}
.modal .cap{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center}
.busy{position:fixed;inset:0;z-index:35;background:color-mix(in srgb,var(--bg) 70%,transparent);display:grid;place-items:center;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<header class="bar"><div class="wrap">
  <button class="brand" data-act="home" aria-label="NeoLung Scan home"><img src="icons/logo-96.png" alt="" width="30" height="30" class="logo">NeoLung Scan <small>Pleura-ABCDE</small></button>
  <span class="sp"></span>
  <button class="btn ghost sm" data-act="refs">References</button>
</div></header>
<main class="wrap" id="app"><p class="muted">Loading…</p></main>
<div id="dock"></div>
<div id="modal"></div>
<div class="toast" id="toast" hidden></div>

<script src="vendor/jszip.min.js"></script>

<script>
"use strict";
const APP_VERSION="1.1.0";
/* ================= protocol definition ================= */
const ZONES={
 R1:{code:"RUA",name:"Right upper anterior",view:"front",core:true,where:"Right front of chest, between the parasternal line and the anterior axillary line, above the nipple line.",pos:"Supine, head midline, arms relaxed."},
 R2:{code:"RLA",name:"Right lower anterior",view:"front",core:true,where:"Right front of chest, between the parasternal line and the anterior axillary line, below the nipple line down to the diaphragm.",pos:"Supine."},
 R3:{code:"RL",name:"Right lateral",view:"front",core:true,where:"Right side, between the anterior and posterior axillary lines, from the axilla to the costal margin.",pos:"Supine. Slide the probe round to the side; tilt the baby slightly to the left if needed."},
 R4:{code:"RUP",name:"Right upper posterior",view:"back",core:false,where:"Right back, between the paravertebral line and the posterior axillary line, upper half.",pos:"Turn the baby onto the left side or prone with a second person. Skip if the baby is unstable."},
 R5:{code:"RLP",name:"Right lower posterior",view:"back",core:false,where:"Right back, between the paravertebral line and the posterior axillary line, lower half to the diaphragm.",pos:"Same position as R4. In a supine baby, effusion collects at the costodiaphragmatic recess near the posterior axillary line."},
 L1:{code:"LUA",name:"Left upper anterior",view:"front",core:true,where:"Left front of chest, between the parasternal line and the anterior axillary line, above the nipple line.",pos:"Supine. The heart may limit the window medially; move slightly lateral."},
 L2:{code:"LLA",name:"Left lower anterior",view:"front",core:true,where:"Left front of chest, between the parasternal line and the anterior axillary line, below the nipple line down to the diaphragm.",pos:"Supine."},
 L3:{code:"LL",name:"Left lateral",view:"front",core:true,where:"Left side, between the anterior and posterior axillary lines, from the axilla to the costal margin.",pos:"Supine. Slide the probe round to the side; tilt the baby slightly to the right if needed."},
 L4:{code:"LUP",name:"Left upper posterior",view:"back",core:false,where:"Left back, between the paravertebral line and the posterior axillary line, upper half.",pos:"Turn the baby onto the right side or prone with a second person. Skip if the baby is unstable."},
 L5:{code:"LLP",name:"Left lower posterior",view:"back",core:false,where:"Left back, between the paravertebral line and the posterior axillary line, lower half to the diaphragm.",pos:"Same position as L4. Check the costodiaphragmatic recess for effusion."}
};
const ALLZ=["R1","R2","R3","R4","R5","L1","L2","L3","L4","L5"];
const ORDER={"6":["R1","R2","R3","L1","L2","L3"],"10":["R1","R2","R3","L1","L2","L3","R4","R5","L4","L5"]};
const FIND=[
 {k:"sliding",g:"Pleura",l:"Lung sliding",o:["Present","Absent","Not assessed"],ref:"mmode"},
 {k:"mmode",g:"Pleura",l:"M-mode",o:["Seashore","Stratosphere","Not done"],ref:"mmode"},
 {k:"morph",g:"Pleura",l:"Pleural line morphology",o:["Thin","Irregular"],ref:"morphology"},
 {k:"alines",g:"A",l:"A-lines",o:["Present","Absent"],ref:"alines"},
 {k:"spared",g:"B",l:"Spared B-lines",o:["Absent","Present"],ref:"spared"},
 {k:"confl",g:"B",l:"Confluent B-lines",o:["Absent","Present"],ref:"confluent"},
 {k:"consol",g:"C",l:"Consolidation",o:["Absent","Present"],ref:"consolidation",size:"consolSize",unit:"cm",sizeLabel:"Depth (consolidation index)"},
 {k:"airbr",g:"C",l:"Air bronchogram",o:["Absent","Present"],ref:"airbr",when:f=>f.consol==="Present"},
 {k:"lp",g:"D",l:"Lung point",o:["Absent","Present"],ref:"lungpoint"},
 {k:"dlp",g:"D",l:"Double lung point",o:["Absent","Present"],ref:"dlp"},
 {k:"eff",g:"E",l:"Pleural effusion",o:["Absent","Present"],ref:"effusion",size:"effSize",unit:"mm",sizeLabel:"Maximum depth (transverse, 4th ICS)"}
];
const GROUPS=[["Pleura","P"],["A","A"],["B","B"],["C","C"],["D","D"],["E","E"]];
const BASE_F={sliding:"Present",mmode:"Not done",morph:"Thin",alines:"Present",spared:"Absent",confl:"Absent",consol:"Absent",lp:"Absent",dlp:"Absent",eff:"Absent"};
const PATTERNS=[
 {id:"normal",l:"Normal",d:"A-lines, no B-lines",f:{},score:0},
 {id:"spared",l:"Spared B-lines",d:"Isolated B-lines",f:{spared:"Present"},score:1},
 {id:"white",l:"White lung",d:"Confluent B-lines",f:{alines:"Absent",confl:"Present",morph:"Irregular"},score:2},
 {id:"consol",l:"Consolidation",d:"Tissue-like area",f:{alines:"Absent",confl:"Present",consol:"Present",morph:"Irregular"},score:null}
];
const patternOf=f=>{const p=PATTERNS.find(p=>Object.entries({...BASE_F,...p.f}).every(([k,v])=>f[k]===v));return p?p.id:null};
const SCORE_DESC=["A-lines, or fewer than 3 B-lines","Spared (well-spaced) B-lines","Confluent B-lines, with or without subpleural consolidation","Extended consolidation"];
const QC=[["pleura","Pleural line and rib shadows visible"],["sag","Sagittal view, image not tilted"],["glare","No glare, reflection or blur"],["noid","No patient name or ID in frame"]];
const SUPPORT=["None","Low-flow oxygen","HFNC","CPAP","NIPPV","nHFO","CMV","iHFO"];
const PROTOCOL_NAME="Pleura-ABCDE (Sandig et al. 2025)";
const SCORE_NAME="Brat et al. 2015 LUS score, 0-3 per zone";
const ATTR="Reference images: Sandig J, et al. Pleura-ABCDE - a structured expert-based protocol for neonatal lung ultrasound documentation and interpretation. Ultrasound J 2025;17:48. CC BY 4.0.";

/* ================= storage (IndexedDB, memory fallback) ================= */
const Store=(()=>{
 let db=null,mem=null;
 const open=()=>new Promise(res=>{
  try{const r=indexedDB.open("neolung-scan",1);
   r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("exams",{keyPath:"id"});const s=d.createObjectStore("images",{keyPath:"id"});s.createIndex("exam","examId")};
   r.onsuccess=()=>{db=r.result;res(true)};r.onerror=()=>{mem={exams:new Map(),images:new Map()};res(false)};
  }catch(e){mem={exams:new Map(),images:new Map()};res(false)}});
 const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
 const os=(n,m)=>db.transaction(n,m).objectStore(n);
 return{open,get persistent(){return !!db},
  all:async n=>mem?[...mem[n].values()]:req(os(n,"readonly").getAll()),
  put:async(n,v)=>mem?mem[n].set(v.id,v):req(os(n,"readwrite").put(v)),
  del:async(n,id)=>mem?mem[n].delete(id):req(os(n,"readwrite").delete(id)),
  get:async(n,id)=>mem?mem[n].get(id):req(os(n,"readonly").get(id)),
  imgs:async examId=>mem?[...mem.images.values()].filter(i=>i.examId===examId):req(os("images","readonly").index("exam").getAll(examId))
 }})();

const imgsOf=(id,z)=>(IMG.get(id)||[]).filter(i=>!z||i.zone===z).sort((a,b)=>a.t-b.t);
function url(rec){if(!URLS.has(rec.id))URLS.set(rec.id,URL.createObjectURL(rec.blob));return URLS.get(rec.id)}

/* ================= clinical helpers ================= */
function pnaDays(e){const {dob}=e.patient;if(!dob||!e.clin.dt)return null;const d=(new Date(e.clin.dt)-new Date(dob+"T00:00"))/864e5;return d>=0?Math.floor(d):null}
function gaDays(s){const m=String(s||"").match(/^(\d{2})(?:\s*\+\s*(\d))?$/);return m?(+m[1])*7+(+(m[2]||0)):null}
function cga(e){const g=gaDays(e.patient.ga),p=pnaDays(e);if(g===null||p===null)return"";const t=g+p;return `${Math.floor(t/7)}+${t%7}`}
function weightKg(e){const w=+e.patient.cw||+e.patient.bw;return w?w/1000:null}
function consolThreshold(e){const kg=weightKg(e);return kg?Math.min(+(0.5*kg).toFixed(2),1):null}
function suggest(e,z){
 const f=e.zones[z].f;
 if(f.consol==="Present"){const s=parseFloat(f.consolSize);if(!s)return{v:null,why:"Enter the consolidation depth to get a suggestion"};
  const kg=weightKg(e);const big=s>1||(kg&&s>=0.5*kg);if(big)return{v:3,why:`Consolidation ${s} cm meets the threshold (0.5 cm/kg or over 1 cm)`};}
 if(f.confl==="Present")return{v:2,why:"Confluent B-lines"};
 if(f.consol==="Present")return{v:2,why:"Consolidation below threshold (subpleural)"};
 if(f.spared==="Present")return{v:1,why:"Spared B-lines"};
 if(f.alines==="Present"&&f.spared==="Absent"&&f.confl==="Absent")return{v:0,why:"A-lines without B-lines"};
 return{v:null,why:"Record A-lines and B-lines to get a suggestion"};
}
const required=f=>FIND.filter(d=>!d.when||d.when(f));
function zoneState(e,z){
 const Z=e.zones[z];const ims=imgsOf(e.id,z);const req=required(Z.f);const nf=req.filter(d=>Z.f[d.k]).length;
 const good=ims.some(i=>i.type==="video"||QC.every(([k])=>i.qc&&i.qc[k]));
 const touched=ims.length||nf||Z.score!==null;
 if(!touched)return{s:"idle",nf,nreq:req.length,ims:ims.length,good};
 if(ims.length&&good&&nf===req.length&&Z.score!==null)return{s:"good",nf,nreq:req.length,ims:ims.length,good};
 return{s:"warn",nf,nreq:req.length,ims:ims.length,good};
}
const SCOL={idle:"var(--idle)",warn:"var(--warn)",good:"var(--good)"};
function totals(e){
 const s6=ORDER["6"].map(z=>e.zones[z].score);const s10=ALLZ.map(z=>e.zones[z].score);
 const n6=s6.filter(v=>v!==null).length,n10=s10.filter(v=>v!==null).length;
 return{n6,sum6:s6.reduce((a,v)=>a+(v??0),0),full6:n6===6,n10,sum10:s10.reduce((a,v)=>a+(v??0),0),full10:n10===10};
}
const doneCount=e=>ORDER[e.set].filter(z=>zoneState(e,z).s==="good").length;

/* ================= chest diagram ================= */
function chest(view,hl,e,size=150){
 const front={R1:[46,42,46,38],R2:[46,80,46,40],R3:[14,58,30,62],L1:[108,42,46,38],L2:[108,80,46,40],L3:[156,58,30,62]};
 const back={L4:[46,42,52,40],L5:[46,82,52,40],R4:[102,42,52,40],R5:[102,82,52,40]};
 const B=view==="front"?front:back;
 let s=`<svg viewBox="0 0 200 150" role="img" aria-label="${view==="front"?"Front":"Back"} of chest${hl?", "+hl+" highlighted":""}" style="max-width:${size*1.33}px">
 <path d="M34 22 Q100 6 166 22 Q192 40 192 80 L188 136 Q100 146 12 136 L8 80 Q8 40 34 22Z" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/>
 <line x1="100" y1="18" x2="100" y2="140" stroke="var(--line)" stroke-dasharray="3 4"/>
 ${view==="front"?`<line x1="20" y1="80" x2="180" y2="80" stroke="var(--line)" stroke-dasharray="2 4"/><text x="8" y="14" font-size="11" font-weight="700" fill="var(--muted)">R</text><text x="186" y="14" font-size="11" font-weight="700" fill="var(--muted)">L</text>`:
 `<text x="8" y="14" font-size="11" font-weight="700" fill="var(--muted)">L</text><text x="186" y="14" font-size="11" font-weight="700" fill="var(--muted)">R</text><text x="100" y="14" text-anchor="middle" font-size="9" fill="var(--muted)">BACK</text>`}`;
 Object.entries(B).forEach(([z,[x,y,w,h]])=>{const on=z===hl;const st=e?zoneState(e,z).s:"idle";const used=e?ORDER[e.set].includes(z):true;
  s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="${on?"var(--accent)":used?SCOL[st]:"var(--idle)"}" fill-opacity="${on?.85:used?(st==="idle"?.12:.3):.06}" stroke="${on?"var(--accent)":used?SCOL[st]:"var(--line)"}" stroke-width="${on?2:1}" ${used?"":'stroke-dasharray="3 3"'}/>
  <text x="${x+w/2}" y="${y+h/2+4}" text-anchor="middle" font-size="11" font-weight="600" font-family="IBM Plex Mono, monospace" fill="${on?"var(--accent-ink)":"var(--ink)"}">${z}${e&&e.zones[z].score!==null&&!on?":"+e.zones[z].score:""}</text>`});
 return s+"</svg>";
}

async function intake(files,source){
 const e=ex();if(!e)return;const z=V.zone;const list=[...files];
 for(const f of list){
  if(f.type.startsWith("video")||/\.(mp4|mov)$/i.test(f.name)){const rec={id:uid("i"),examId:e.id,zone:z,type:"video",blob:f,ext:/\.mov$/i.test(f.name)||f.type==="video/quicktime"?"mov":"mp4",source,t:Date.now(),qc:{}};await Store.put("images",rec);IMG.set(e.id,[...(IMG.get(e.id)||[]),rec]);continue}
  if(!f.type.startsWith("image")&&!/\.(jpe?g|png|heic|webp)$/i.test(f.name)){toast(`${f.name}: not an image or clip`);continue}
  if(list.length===1){try{const bmp=await loadImage(f);V.crop={canvas:bmp,rect:null,source};return go("crop",{})}catch(err){toast("This image format cannot be opened here. Try JPEG or PNG.");return}}
  try{const c=await loadImage(f);await storeCanvas(c,null,source)}catch(err){toast(`${f.name} could not be opened`)}
 }
 await saveExam(e);render();
}
function loadImage(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const max=2400;const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c)};im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
async function storeCanvas(src,rect,source){
 const e=ex();const r=rect||{x:0,y:0,w:src.width,h:src.height};const max=1600;const s=Math.min(1,max/Math.max(r.w,r.h));
 const c=document.createElement("canvas");c.width=Math.max(1,Math.round(r.w*s));c.height=Math.max(1,Math.round(r.h*s));
 c.getContext("2d").drawImage(src,r.x,r.y,r.w,r.h,0,0,c.width,c.height);
 const blob=await new Promise(res=>c.toBlob(res,"image/jpeg",0.9));
 const rec={id:uid("i"),examId:e.id,zone:V.zone,type:"image",ext:"jpg",blob,w:c.width,h:c.height,source,cropped:!!rect,t:Date.now(),qc:{}};
 await Store.put("images",rec);IMG.set(e.id,[...(IMG.get(e.id)||[]),rec]);return rec;
}
function initCrop(){
 const cv=$("#cropc");const C=V.crop;if(!cv||!C)return;const src=C.canvas;cv.width=src.width;cv.height=src.height;const g=cv.getContext("2d");
 const draw=()=>{g.drawImage(src,0,0);if(C.rect){const r=C.rect;g.fillStyle="rgba(0,0,0,.6)";g.fillRect(0,0,cv.width,r.y);g.fillRect(0,r.y+r.h,cv.width,cv.height-r.y-r.h);g.fillRect(0,r.y,r.x,r.h);g.fillRect(r.x+r.w,r.y,cv.width-r.x-r.w,r.h);g.strokeStyle="#6db2cf";g.lineWidth=Math.max(2,cv.width/300);g.setLineDash([cv.width/60,cv.width/90]);g.strokeRect(r.x,r.y,r.w,r.h);g.setLineDash([])}
  const info=$("#cropinfo");if(info)info.textContent=C.rect?`${Math.round(C.rect.w)}×${Math.round(C.rect.h)} px`:`${cv.width}×${cv.height} px, whole image`};
 draw();let start=null;
 const pt=ev=>{const b=cv.getBoundingClientRect();const sx=cv.width/b.width;return{x:Math.max(0,Math.min(cv.width,(ev.clientX-b.left)*sx)),y:Math.max(0,Math.min(cv.height,(ev.clientY-b.top)*sx))}};
 cv.onpointerdown=ev=>{cv.setPointerCapture(ev.pointerId);start=pt(ev);C.rect=null;draw()};
 cv.onpointermove=ev=>{if(!start)return;const p=pt(ev);const r={x:Math.min(start.x,p.x),y:Math.min(start.y,p.y),w:Math.abs(p.x-start.x),h:Math.abs(p.y-start.y)};C.rect=r.w>20&&r.h>20?r:null;draw()};
 cv.onpointerup=()=>{start=null;const b=document.querySelector('[data-act="cropsave"]');if(b)b.textContent=C.rect?"Save cropped image":"Save whole image"};
 C.redraw=draw;
}

 doc.setFontSize(16);doc.text(t.full6?`${t.sum6} / 18`:`incomplete (${t.n6}/6)`,x0+3,y+12.5);

 y+=20;doc.setFontSize(9.5);doc.setFont("helvetica","bold");doc.text("Interpretation",x0,y);doc.setFont("helvetica","normal");doc.setFontSize(9);
 const it=doc.splitTextToSize(e.interp||"-",W-2*M);doc.text(it.slice(0,10),x0,y+5);y+=6+Math.min(it.length,10)*4;
 const inc=ord.filter(z=>zoneState(e,z).s!=="good");if(inc.length){doc.setTextColor(179,38,30);doc.text("Incomplete zones: "+inc.join(", "),x0,y+2);doc.setTextColor(...ink)}
 const comments=ord.filter(z=>e.zones[z].comment);
 const footer=()=>{doc.setFontSize(6.8);doc.setTextColor(...mut);doc.text(doc.splitTextToSize(`Protocol: Sandig J et al. Ultrasound J 2025;17:48 (CC BY 4.0). Score: Brat R et al. JAMA Pediatr 2015. Generated ${new Date().toISOString().slice(0,16).replace("T"," ")} by NeoLung Scan prototype; not a validated medical device. No severity category or treatment threshold applied.`,W-2*M),M,288)};
 footer();
 // comments + images
 const items=[];ALLZ.forEach(z=>imgsOf(e.id,z).forEach((m,i)=>items.push({m,z,i})));
 if(comments.length||items.length){doc.addPage();y=16;doc.setTextColor(...ink);doc.setFont("helvetica","bold");doc.setFontSize(13);doc.text("Snapshots by zone",M,y);doc.setFontSize(9);doc.setFont("helvetica","normal");doc.setTextColor(...mut);doc.text(e.studyId,W-M,y,{align:"right"});y+=6;
  if(comments.length){doc.setTextColor(...ink);comments.forEach(z=>{const l=doc.splitTextToSize(`${z}: ${e.zones[z].comment}`,W-2*M);doc.text(l,M,y+3);y+=l.length*4+1});y+=3}}
 const boxH=112;
 for(const it of items){
  if(y+boxH+12>282){footer();doc.addPage();y=16}
  const {m,z,i}=it;const Z=e.zones[z];
  doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(...ink);doc.text(`${z} ${ZONES[z].code} - ${ZONES[z].name}  |  image ${i+1}  |  score ${Z.score??"-"}`,M,y+4);
  doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.setTextColor(...mut);doc.text(names.get(m.id),M,y+8.5);y+=11;
  if(m.type==="video"){doc.setFillColor(10,14,17);doc.rect(M,y,W-2*M,24,"F");doc.setTextColor(200,212,218);doc.setFontSize(9);doc.text("Video clip - see images folder",W/2,y+13,{align:"center"});y+=30;continue}
  const data=await blobToDataURL(m.blob);const s=Math.min((W-2*M)/m.w,(boxH-14)/m.h);const iw=m.w*s,ih=m.h*s;
  doc.setFillColor(10,14,17);doc.rect(M,y,W-2*M,ih,"F");doc.addImage(data,"JPEG",M+(W-2*M-iw)/2,y,iw,ih);y+=ih+3;
  const ok=QC.every(([k])=>m.qc&&m.qc[k]);doc.setFontSize(7.5);doc.setTextColor(...(ok?[43,135,84]:[179,119,9]));doc.text(ok?"Quality checks passed":"Quality checks incomplete",M,y+2);y+=8;
 }
 if(items.length)footer();
 return doc.output("blob");
}
async function getDownloads(){try{return window.claude&&typeof window.claude.use==="function"?await window.claude.use("downloads"):null}catch(err){return null}}
async function deliver(fname,blob){
 const dl=await getDownloads();
 if(dl){const r=await dl.save({filename:fname,data:blob});return r.status==="delivered"?"sent":"saved"}
 const type=fname.endsWith(".pdf")?"application/pdf":"application/zip";
 try{const file=new File([blob],fname,{type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
   try{await navigator.share({files:[file],title:fname});return "shared"}
   catch(err){if(err&&err.name==="AbortError")throw{code:"declined"}}}
 }catch(err){if(err&&err.code)throw err}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;a.rel="noopener";document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},10000);return "downloaded";
}
async function doExport(pdfOnly){
 const e=ex();if(!window.jspdf||(!pdfOnly&&!window.JSZip)){V.exportMsg={ok:false,html:"The export libraries did not load. Reload the app and try again."};return render()}
 $("#busy").hidden=false;let blob,fname;
 try{const {base,map}=fileNames(e);const pdf=await buildPDF(e,map,V.incId);
  if(pdfOnly){blob=pdf;fname=`${base}_protocol.pdf`}
  else{const zip=new JSZip();const root=zip.folder(base);root.file(`${base}_protocol.pdf`,pdf);const imf=root.folder("images");
   imgsOf(e.id).forEach(m=>imf.file(map.get(m.id),m.blob));root.file("metadata.json",JSON.stringify(metadata(e,map),null,2));root.file("findings.csv",csv(e));
   root.file("README.txt",`NeoLung Scan export\nStudy ID: ${e.studyId}\nProtocol: ${PROTOCOL_NAME}\nScore: ${SCORE_NAME}\nImages are named STUDYID_YYYYMMDD-HHMM_ZONE-CODE_N. metadata.json links each image to its zone, findings, score and quality checks.\nNo patient name, registration number or date of birth is included in images or metadata.\n`);
   blob=await zip.generateAsync({type:"blob",compression:"STORE"});fname=`${base}.zip`}
 }catch(err){$("#busy").hidden=true;V.exportMsg={ok:false,html:"Export failed while building the file: "+esc(err&&err.message||err)};return render()}
 $("#busy").hidden=true;
 try{const how=await deliver(fname,blob);
  if(!pdfOnly){e.exportedAt=Date.now();await saveExam(e)}
  const size=(blob.size/1048576).toFixed(1);
  V.exportMsg={ok:true,html:how==="shared"?`<b>${esc(fname)}</b> (${size} MB) shared. If you chose Drive, check it landed in the review folder.`:
   how==="downloaded"?`<b>${esc(fname)}</b> (${size} MB) downloaded. Upload it from your Downloads to the NeoLung AI review folder in Google Drive.`:
   `<b>${esc(fname)}</b> ${how} (${size} MB). Upload it to the NeoLung AI review folder in Google Drive.`};
 }catch(err){const c=err&&err.code;V.exportMsg={ok:false,html:c==="declined"?"Export cancelled.":c==="too_large"?"The file is too large for this destination. Export the PDF only, or remove some clips.":c==="rate_limited"?"A download prompt is already open. Finish it, then try again.":"The file could not be saved here. Try Download PDF only, or open the app in the phone's browser."}}
 render();
}

async function seedExample(){
 try{if(localStorage.getItem("neolung-scan-seeded"))return}catch(err){}
 if(EX.length)return;const R=window.NL_REFS;if(!R)return;
 const e=newExam();e.studyId="EXAMPLE-01";e.example=true;
 {const d=new Date(Date.now()-2*864e5);Object.assign(e.patient,{ga:"30+2",bw:"1380",cw:"1350",sex:"Female",dob:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`})}Object.assign(e.clin,{support:"CPAP",map:"6",fio2:"30",indication:"Example: respiratory distress on CPAP",operator:"Example"});
 const base={sliding:"Present",mmode:"Not done",morph:"Thin",alines:"Present",spared:"Absent",confl:"Absent",consol:"Absent",lp:"Absent",dlp:"Absent",eff:"Absent"};
 const plan=[["R1","alines",{...base},0],["R2","spared",{...base,alines:"Absent",spared:"Present",morph:"Irregular"},1],["L1","confluent",{...base,alines:"Absent",confl:"Present",morph:"Irregular"},2]];
 for(const [z,k,f,s] of plan){e.zones[z].f=f;e.zones[z].score=s;const blob=await (await fetch(R[k].src)).blob();const im=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=R[k].src});
  const rec={id:uid("i"),examId:e.id,zone:z,type:"image",ext:"jpg",blob,w:im.naturalWidth,h:im.naturalHeight,source:"Example reference image",t:Date.now(),qc:{pleura:true,sag:true,glare:true,noid:true}};
  await Store.put("images",rec);IMG.set(e.id,[...(IMG.get(e.id)||[]),rec])}
 e.zones.R2.comment="Example annotation";await saveExam(e);EX.push(e);
 try{localStorage.setItem("neolung-scan-seeded","1")}catch(err){}
}

/* ================= events ================= */
document.addEventListener("click",async ev=>{
 const a=ev.target.closest("[data-act]");if(!a)return;
 if(a.dataset.act==="closeref"){if(ev.target.closest("[data-stop]")&&!ev.target.closest('button[data-act="closeref"]'))return;$("#modal").innerHTML="";return}
 const act=a.dataset.act;const e=ex();
 switch(act){
  case"home":return go("home",{examId:null,exportMsg:null});
  case"refs":V.prev=V.view==="refs"?V.prev:V.view;return go("refs");
  case"ref":return openRef(a.dataset.ref);
  case"back":return go(V.prev&&V.prev!=="refs"&&V.prev!=="crop"?V.prev:"home");
  case"new":{const n=newExam();EX.push(n);await saveExam(n);return go("setup",{examId:n.id,zone:null,exportMsg:null})}
  case"open":{const x=EX.find(q=>q.id===a.dataset.id);const started=ALLZ.some(z=>zoneState(x,z).s!=="idle");return go(started?"summary":"setup",{examId:x.id,zone:ORDER[x.set][0],exportMsg:null})}
  case"setup":return go("setup");
  case"hideinstall":try{localStorage.setItem("neolung-install-hide","1")}catch(err){}return render();
  case"install":if(installEvt){installEvt.prompt();try{await installEvt.userChoice}catch(err){}installEvt=null;render()}return;
  case"summary":return go("summary",{exportMsg:null});
 }
 if(!e)return;
 switch(act){
  case"set":collectSetup();e.set=a.dataset.v;await saveExam(e);return render();
  case"zone":return go("zone",{zone:a.dataset.z});
  case"nextzone":{const o=ORDER[e.set];return go("zone",{zone:o[o.indexOf(V.zone)+1]})}
  case"prevzone":{const o=ORDER[e.set];return go("zone",{zone:o[o.indexOf(V.zone)-1]})}
  case"pattern":{const Z=e.zones[V.zone];const p=PATTERNS.find(q=>q.id===a.dataset.p);const keep={consolSize:Z.f.consolSize,effSize:Z.f.effSize};
   Z.f={...BASE_F,...p.f};if(Z.f.consol==="Present"&&keep.consolSize)Z.f.consolSize=keep.consolSize;
   Z.score=p.score!==null?p.score:suggest(e,V.zone).v;await saveExam(e);const y=window.scrollY;render();window.scrollTo(0,y);toast(`${p.l}: findings filled. Check and adjust if needed.`);return}
  case"qcall":{const rec=(IMG.get(e.id)||[]).find(i=>i.id===a.dataset.id);if(rec){rec.qc={pleura:true,sag:true,glare:true,noid:true};await Store.put("images",rec);await saveExam(e)}const y=window.scrollY;render();window.scrollTo(0,y);return}
  case"find":{const Z=e.zones[V.zone];const k=a.dataset.k,v=a.dataset.v;Z.f[k]=Z.f[k]===v?undefined:v;if(Z.f[k]===undefined)delete Z.f[k];
   if(k==="consol"&&Z.f.consol!=="Present"){delete Z.f.airbr;delete Z.f.consolSize}if(k==="eff"&&Z.f.eff!=="Present")delete Z.f.effSize;
   await saveExam(e);const y=window.scrollY;render();window.scrollTo(0,y);return}
  case"score":{e.zones[V.zone].score=+a.dataset.v;await saveExam(e);const y=window.scrollY;render();window.scrollTo(0,y);return}
  case"armimg":case"armdel":V.delArm=a.dataset.id||e.id;{const y=window.scrollY;render();window.scrollTo(0,y)}return;
  case"delimg":{const id=a.dataset.id;await Store.del("images",id);IMG.set(e.id,(IMG.get(e.id)||[]).filter(i=>i.id!==id));if(URLS.has(id)){URL.revokeObjectURL(URLS.get(id));URLS.delete(id)}V.delArm=null;await saveExam(e);const y=window.scrollY;render();window.scrollTo(0,y);return}
  case"delete":{for(const m of imgsOf(e.id))await Store.del("images",m.id);await Store.del("exams",e.id);EX=EX.filter(x=>x.id!==e.id);IMG.delete(e.id);toast("Examination deleted from this device");return go("home",{examId:null})}
  case"rot":{const C=V.crop;const s=C.canvas;const c=document.createElement("canvas");c.width=s.height;c.height=s.width;const g=c.getContext("2d");g.translate(c.width,0);g.rotate(Math.PI/2);g.drawImage(s,0,0);C.canvas=c;C.rect=null;return render()}
  case"cropreset":V.crop.rect=null;V.crop.redraw&&V.crop.redraw();{const b=document.querySelector('[data-act="cropsave"]');if(b)b.textContent="Save whole image"}return;
  case"cropsave":{const C=V.crop;await storeCanvas(C.canvas,C.rect,C.source);await saveExam(e);V.crop=null;toast("Snapshot saved. Complete the quality checks.");go("zone");return}
  case"cropcancel":V.crop=null;return go("zone");
  case"export":return doExport(false);
  case"exportpdf":return doExport(true);
  case"incid":V.incId=a.checked;return;
 }
});
document.addEventListener("change",async ev=>{
 const t=ev.target;
 if(t.matches('input[type="file"]')){const fs=t.files;if(fs&&fs.length)await intake(fs,t.dataset.src);t.value="";return}
 const e=ex();if(!e)return;
 if(t.dataset.qc){const rec=(IMG.get(e.id)||[]).find(i=>i.id===t.dataset.id);if(!rec)return;rec.qc={...(rec.qc||{}),[t.dataset.qc]:t.checked};await Store.put("images",rec);await saveExam(e);const y=window.scrollY;render();window.scrollTo(0,y);return}
 if(t.dataset.size){const Zs=e.zones[V.zone];const before=suggest(e,V.zone).v;Zs.f[t.dataset.size]=t.value;if(Zs.score===null||Zs.score===before){const nv=suggest(e,V.zone).v;if(nv!==null)Zs.score=nv}await saveExam(e);const y=window.scrollY;render();window.scrollTo(0,y);return}
 if(t.closest("#setupForm")){collectSetup();await saveExam(e);const c=$("#s-cga");if(c)c.value=cga(e)||"From DOB and GA"}
});
document.addEventListener("input",ev=>{
 const t=ev.target;const e=ex();if(!e)return;const b=t.dataset.bind;
 if(b==="comment"){e.zones[V.zone].comment=t.value;clearTimeout(t._h);t._h=setTimeout(()=>saveExam(e),400)}
 if(b==="interp"){e.interp=t.value;clearTimeout(t._h);t._h=setTimeout(()=>saveExam(e),400)}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&$("#modal").innerHTML)$("#modal").innerHTML=""});
function collectSetup(){
 const f=$("#setupForm");const e=ex();if(!f||!e)return;
 new FormData(f).forEach((v,k)=>{if(k==="studyId")e.studyId=String(v).trim().replace(/[^A-Za-z0-9_-]/g,"-")||e.studyId;else{const [o,p]=k.split(".");(o==="p"?e.patient:e.clin)[p]=String(v)}});
}
document.addEventListener("submit",async ev=>{
 ev.preventDefault();if(ev.target.id!=="setupForm")return;collectSetup();const e=ex();
 if(!e.studyId){toast("Enter a study ID");return}
 if(EX.some(x=>x.id!==e.id&&x.studyId===e.studyId&&x.clin.dt===e.clin.dt)){toast("Another examination on this device has the same study ID and time");return}
 await saveExam(e);go("zone",{zone:ORDER[e.set][0]});
});

(async()=>{
